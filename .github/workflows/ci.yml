name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck v3
        run: bun run typecheck:v3

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt

      - name: Test
        run: bun run test

      - name: Test v3
        run: bun run test:v3

      - name: Build
        run: bun run build
